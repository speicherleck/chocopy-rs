disable_changelog    = true
ignore_fixup_commits = true
ignore_merge_commits = true
tag_prefix           = "v"




[commit_types]




[git_hooks.commit-msg]

script = """
#!/bin/sh

set -e

cog verify --file $1
"""




[git_hooks.pre-commit]

script = """
#!/bin/sh

set -e

taplo fmt --check

cargo fmt --all --check
"""




[git_hooks.pre-push]

script = """
#!/bin/sh

set -e

cog check
"""
